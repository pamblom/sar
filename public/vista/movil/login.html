<!-- Liquid Glass Credential Card -->

<!-- Specular Refraction Top Glow -->

<!-- Welcome Text Inside Card -->

          Bienvenido de nuevo
        </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 leading-relaxed">
          Ingresa tus credenciales para acceder a la red pericial de acopio circular.
        </p>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-md" id="sar-login-form" onsubmit="event.preventDefault();">
<!-- Field 1: User / Enterprise Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary font-medium flex items-center gap-1.5" for="username">
<span class="material-symbols-outlined text-[16px] text-tertiary">alternate_email</span>
            Usuario o Correo Electronico</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-10 rounded-lg bg-surface-container-lowest/80 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors duration-200" id="username" name="username" placeholder="usuario@empresa.com o ID_operador" required="" type="text">
<div class="absolute right-3 text-secondary/60 pointer-events-none flex items-center">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
</div>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-secondary font-medium flex items-center gap-1.5" for="password">
<span class="material-symbols-outlined text-[16px] text-tertiary">lock</span>
            Contraseña
          </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-lg bg-surface-container-lowest/80 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors duration-200" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-2.5 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-tertiary active:scale-95 transition-all" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Device & Forgot Link -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<div class="relative flex items-center">
<input class="sr-only peer" id="remember-me" type="checkbox">
<div class="w-5 h-5 rounded bg-surface-container-lowest peer-checked:bg-tertiary flex items-center justify-center transition-all duration-200 shadow-inner">
<span class="material-symbols-outlined text-[15px] text-on-tertiary opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">
              Recordar dispositivo
            </span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed underline-offset-4 hover:underline transition-colors" href="javascript:void(0)">

<!-- Primary Action CTA -->
<button class="w-full h-12 mt-1 rounded-lg bg-gradient-to-r from-tertiary to-primary text-on-primary font-title-md text-title-md font-semibold tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-tertiary-container/30 active:scale-[0.98] hover:brightness-110 transition-all duration-200" id="login-btn" type="submit">
<span class="">Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center my-0.5 w-full"><div class="flex-1 h-px bg-surface-variant"></div><span class="px-3 text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider whitespace-nowrap">o accede con</span><div class="flex-1 h-px bg-surface-variant"></div></div>
<!-- Secondary Biometric Glass Access -->
<button class="w-full h-12 rounded-lg bg-secondary-container/35 hover:bg-secondary-container/55 active:bg-secondary-container/70 text-on-surface flex items-center justify-center gap-2.5 font-label-md text-label-md transition-all active:scale-[0.99] backdrop-blur-md" id="google-login-btn" type="button"><svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path><path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path><path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path><path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path></svg><span class="font-medium text-primary-fixed">Continuar con Google</span></button>
</form>
<!-- Registration Footnote -->
<div class="mt-space-md text-center pt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">

        </button>
</div>
</div>
<!-- Security Footprint Meta -->
<div class="flex items-center gap-2 mt-space-lg text-on-surface-variant/70 font-label-sm text-label-sm text-center">
<span class="material-symbols-outlined text-[15px] text-tertiary">verified_user</span>
<span class="">Cifrado TLS 1.3 • Nodo Pericial SAR Mobile v2.4</span>
</div>
</div>
<script>
    (function initLoginInteractions() {
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-pwd-btn');
      const eyeIcon = document.getElementById('eye-icon');
      const biometricBtn = document.getElementById('biometric-btn');
      const loginForm = document.getElementById('sar-login-form');
      const loginBtn = document.getElementById('login-btn');

      if (toggleBtn && pwdInput && eyeIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = pwdInput.type === 'password';
          pwdInput.type = isPassword ? 'text' : 'password';
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
          eyeIcon.classList.toggle('text-tertiary', isPassword);
        });
      }

      if (biometricBtn) {
        biometricBtn.addEventListener('click', () => {
          const originalContent = biometricBtn.innerHTML;
          biometricBtn.innerHTML = `
            <span class="material-symbols-outlined text-tertiary animate-spin text-[22px]">sync</span>
            <span class="font-medium text-primary-fixed">Verificando sensor biométrico...</span>
          `;
          setTimeout(() => {
            biometricBtn.innerHTML = `
              <span class="material-symbols-outlined text-tertiary text-[22px]">check_circle</span>
              <span class="font-medium text-primary-fixed">Identidad Reconocida</span>
            `;
            setTimeout(() => {
              biometricBtn.innerHTML = originalContent;
            }, 1800);
          }, 1200);
        });
      }

      if (loginForm && loginBtn) {
        loginForm.addEventListener('submit', () => {
          const originalText = loginBtn.innerHTML;
          loginBtn.disabled = true;
          loginBtn.innerHTML = `
            <span class="material-symbols-outlined animate-spin text-[20px]">sync</span>
            <span>Conectando con nodo SAR...</span>
          `;
          setTimeout(() => {
            loginBtn.innerHTML = `
              <span class="material-symbols-outlined text-[20px]">done</span>
              <span>Autenticado</span>
            `;
            setTimeout(() => {
              loginBtn.disabled = false;
              loginBtn.innerHTML = originalText;
            }, 1500);
          }, 1400);
        });
      }
    })();
  </script>
